name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e .
      - name: analyzer calibration
        run: earshot selftest
      - name: battery loads and plans
        run: |
          earshot rubric
          python -c "
          from earshot import battery
          b = battery.load('default')
          assert len(b.scenarios) == 18, len(b.scenarios)
          assert len(b.plan(['A','B'], seed=1)) == 18*2*b.runs_per_scenario
          print('battery ok:', b.name)
          "
      - run: python -m compileall -q earshot
