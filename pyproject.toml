[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earshot"
version = "0.1.0"
description = "Blind, reproducible benchmark for production phone voice agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Shiva Arunachalam" }]
keywords = ["voice-ai", "benchmark", "eval", "telephony", "barge-in", "latency", "asr"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
  "numpy>=1.22",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
judge = ["anthropic>=1.0"]
twilio = ["twilio>=9.0", "flask>=3.0"]
all = ["anthropic>=1.0", "twilio>=9.0", "flask>=3.0"]

[project.scripts]
earshot = "earshot.cli:main"

[project.urls]
Homepage = "https://github.com/arunash/earshot"
Issues = "https://github.com/arunash/earshot/issues"

[tool.setuptools.packages.find]
include = ["earshot*"]

[tool.setuptools.package-data]
earshot = ["batteries/*.yaml", "prompts/*.md"]
